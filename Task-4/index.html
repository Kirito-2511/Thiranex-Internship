<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Real-time Weather Dashboard — search any city worldwide for current conditions, 7-day forecast, and more. Powered by Open-Meteo API.">
  <meta name="keywords" content="weather, forecast, dashboard, temperature, humidity, wind, real-time">
  <meta name="author" content="Thiranex Internship — Task 4">

  <!-- Open Graph -->
  <meta property="og:title" content="Weather Dashboard — Real-Time Forecasts">
  <meta property="og:description" content="Premium weather dashboard with current conditions, 7-day forecast, and dynamic backgrounds.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="en_US">

  <title>Weather Dashboard — Real-Time Forecasts</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Dynamic Background -->
  <div class="bg-layer" id="bgLayer" aria-hidden="true"></div>
  <div class="bg-overlay" aria-hidden="true"></div>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header" role="banner">
      <div class="header-left">
        <h1 class="logo" aria-label="Weather Dashboard">
          <span class="logo-icon" aria-hidden="true">🌤️</span>
          <span class="logo-text">WeatherPulse</span>
        </h1>
      </div>
      <div class="header-right">
        <!-- Unit Toggle -->
        <div class="unit-toggle" role="group" aria-label="Temperature unit toggle">
          <button class="unit-btn active" id="btnCelsius" aria-pressed="true" data-unit="C">°C</button>
          <button class="unit-btn" id="btnFahrenheit" aria-pressed="false" data-unit="F">°F</button>
        </div>
        <!-- Theme Toggle -->
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark and light mode" title="Toggle theme">
          <span class="theme-icon" id="themeIcon">🌙</span>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main role="main" aria-label="Weather information">
      <!-- Search Section -->
      <section class="search-section" aria-label="City search">
        <div class="search-wrapper">
          <div class="search-bar" role="search">
            <span class="search-icon" aria-hidden="true">🔍</span>
            <input
              type="text"
              id="searchInput"
              class="search-input"
              placeholder="Search for a city…"
              autocomplete="off"
              aria-label="Search for a city"
              aria-expanded="false"
              aria-controls="autocompleteList"
              aria-autocomplete="list"
            >
            <button class="geo-btn" id="geoBtn" aria-label="Use my current location" title="Detect my location">
              📍
            </button>
          </div>
          <!-- Autocomplete Dropdown -->
          <ul class="autocomplete-list" id="autocompleteList" role="listbox" aria-label="City suggestions"></ul>
        </div>
        <!-- Recent Searches -->
        <div class="recent-searches" id="recentSearches" aria-label="Recent searches">
          <span class="recent-label">Recent:</span>
          <div class="recent-chips" id="recentChips" role="list"></div>
        </div>
      </section>

      <!-- Error Message -->
      <div class="error-banner" id="errorBanner" role="alert" aria-live="polite" hidden>
        <span class="error-icon" aria-hidden="true">⚠️</span>
        <p class="error-text" id="errorText"></p>
        <button class="error-close" id="errorClose" aria-label="Dismiss error">✕</button>
      </div>

      <!-- Loading Skeleton -->
      <section class="skeleton-container" id="skeletonContainer" hidden aria-label="Loading weather data">
        <div class="skeleton-current">
          <div class="skel skel-city"></div>
          <div class="skel skel-temp"></div>
          <div class="skel skel-details"></div>
          <div class="skel skel-details short"></div>
        </div>
        <div class="skeleton-forecast">
          <div class="skel skel-card"></div>
          <div class="skel skel-card"></div>
          <div class="skel skel-card"></div>
          <div class="skel skel-card"></div>
          <div class="skel skel-card"></div>
          <div class="skel skel-card"></div>
          <div class="skel skel-card"></div>
        </div>
      </section>

      <!-- Weather Content (hidden until data loaded) -->
      <div id="weatherContent" class="weather-content" hidden>
        <!-- Current Weather -->
        <section class="current-weather" id="currentWeather" aria-label="Current weather conditions">
          <div class="current-location">
            <h2 class="city-name" id="cityName"></h2>
            <p class="city-meta" id="cityMeta"></p>
          </div>
          <div class="current-main">
            <div class="current-temp-group">
              <span class="weather-emoji" id="currentEmoji" aria-hidden="true"></span>
              <span class="current-temp" id="currentTemp"></span>
            </div>
            <p class="current-condition" id="currentCondition"></p>
          </div>
          <div class="current-details" role="list" aria-label="Weather details">
            <div class="detail-card" role="listitem">
              <span class="detail-icon" aria-hidden="true">💧</span>
              <span class="detail-label">Humidity</span>
              <span class="detail-value" id="humidity"></span>
            </div>
            <div class="detail-card" role="listitem">
              <span class="detail-icon" aria-hidden="true">💨</span>
              <span class="detail-label">Wind</span>
              <span class="detail-value" id="windSpeed"></span>
            </div>
            <div class="detail-card" role="listitem">
              <span class="detail-icon" aria-hidden="true">🌡️</span>
              <span class="detail-label">Feels Like</span>
              <span class="detail-value" id="feelsLike"></span>
            </div>
            <div class="detail-card" role="listitem">
              <span class="detail-icon" aria-hidden="true">👁️</span>
              <span class="detail-label">Visibility</span>
              <span class="detail-value" id="visibility"></span>
            </div>
            <div class="detail-card" role="listitem">
              <span class="detail-icon" aria-hidden="true">📊</span>
              <span class="detail-label">Pressure</span>
              <span class="detail-value" id="pressure"></span>
            </div>
            <div class="detail-card" role="listitem">
              <span class="detail-icon" aria-hidden="true">☀️</span>
              <span class="detail-label">UV Index</span>
              <span class="detail-value" id="uvIndex"></span>
            </div>
          </div>
        </section>

        <!-- 7-Day Forecast -->
        <section class="forecast-section" aria-label="7-day weather forecast">
          <h3 class="section-title">📅 7-Day Forecast</h3>
          <div class="forecast-grid" id="forecastGrid" role="list"></div>
        </section>

        <!-- Hourly Glance -->
        <section class="hourly-section" aria-label="Hourly forecast">
          <h3 class="section-title">🕐 Next 24 Hours</h3>
          <div class="hourly-scroll" id="hourlyScroll" role="list" tabindex="0"></div>
        </section>
      </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer" role="contentinfo">
      <p>Powered by <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a> · Built with vanilla JS · Thiranex Internship Task 4</p>
    </footer>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
