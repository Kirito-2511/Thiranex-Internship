<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ShopNex - The ultimate e-commerce experience. Browse our premium catalogue of electronics, fashion, and accessories.">
  <meta name="author" content="Vidhan Wahane">
  <title>Catalogue | ShopNex</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header -->
  <header class="header" role="banner">
    <div class="header__inner">
      <div class="header__left">
        <button class="menu-toggle" id="menuToggle" aria-expanded="false" aria-label="Toggle navigation">☰</button>
        <a href="index.html" class="logo" aria-label="ShopNex Home">
          <span class="logo__icon" aria-hidden="true">🛍️</span>
          <span class="logo__text">ShopNex</span>
        </a>
      </div>
      
      <nav class="nav" id="mainNav" role="navigation" aria-label="Main menu">
        <a href="index.html" class="nav__link nav__link--active" aria-current="page">Catalogue</a>
        <a href="#" class="nav__link">Categories</a>
        <a href="#" class="nav__link">Deals</a>
        <a href="#" class="nav__link">Support</a>
      </nav>

      <div class="header__right">
        <button class="btn-icon theme-toggle" id="themeToggle" aria-label="Toggle theme">☀️</button>
        <a href="cart.html" class="cart-btn" aria-label="View shopping cart">
          <span class="cart-btn__icon" aria-hidden="true">🛒</span>
          <span class="cart-badge" aria-hidden="true">0</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Mobile Sidebar Overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

  <!-- Main Layout -->
  <main class="main-layout" role="main">
    
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="Filters">
      <div class="sidebar__header">
        <h2 class="sidebar__title">Filters</h2>
        <button class="btn-icon sidebar__close" id="sidebarClose" aria-label="Close filters">✕</button>
      </div>

      <div class="filter-group">
        <h3 class="filter-group__title">Categories</h3>
        <ul class="sidebar__list" id="categoryList">
          <!-- Populated by JS -->
        </ul>
      </div>

      <div class="filter-group">
        <h3 class="filter-group__title">Price Range</h3>
        <div class="price-filter">
          <input type="range" id="priceRange" class="price-slider" aria-label="Maximum price">
          <div class="price-display" id="priceDisplay">$0 - $999</div>
        </div>
      </div>
    </aside>

    <!-- Catalogue Content -->
    <div class="catalogue">
      <div class="toolbar">
        <button class="btn btn--outline filter-toggle" id="filterToggle" aria-label="Open filters">
          <span aria-hidden="true">⚙️</span> Filters
        </button>

        <div class="search-box">
          <span class="search-box__icon" aria-hidden="true">🔍</span>
          <input type="search" id="searchInput" class="search-box__input" placeholder="Search products..." aria-label="Search products">
        </div>

        <div class="toolbar__actions">
          <span class="product-count" id="productCount">Loading...</span>
          
          <select id="sortSelect" class="sort-select" aria-label="Sort products">
            <option value="newest">Newest Arrivals</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="rating">Top Rated</option>
          </select>

          <div class="view-toggle" role="group" aria-label="View toggle">
            <button class="view-toggle__btn view-toggle__btn--active" data-view="grid" aria-label="Grid view" aria-pressed="true">⊞</button>
            <button class="view-toggle__btn" data-view="list" aria-label="List view" aria-pressed="false">☰</button>
          </div>
        </div>
      </div>

      <!-- Products Grid -->
      <div class="product-grid" id="productGrid" role="list" aria-label="Product list">
        <!-- Rendered by JS -->
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer" role="contentinfo">
    <p>Built with vanilla JS & state-driven architecture · Thiranex Internship Task 5</p>
  </footer>

  <!-- Scripts -->
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
